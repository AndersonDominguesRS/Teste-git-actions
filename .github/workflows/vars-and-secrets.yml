name: Testando Variáveis e Secrets

on:
  workflow_dispatch

jobs:
  test-vars-secrets:
    runs-on: self-hosted

    steps:
      - name: Mostrar variáveis não sensíveis
        run: |
          echo "APP_MODE = ${{ vars.APP_MODE }}"
          echo "SUPORTE_EMAIL = ${{ vars.SUPORTE_EMAIL }}"

      - name: Simular tarefa sensível usando secret
        env:
          TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          echo "Iniciando autenticação segura..."
          echo "Token recebido (mas mascarado pelo GitHub): $TOKEN"
          echo "Autenticação simulada com sucesso!"

      - name: Validar que o secret está disponível
        env:
          TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          echo "Tamanho do token: ${#TOKEN}"
